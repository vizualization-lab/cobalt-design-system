<!doctype html>
<html lang="en" data-co-base>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobalt starter</title>
  </head>
  <body>
    <main class="starter-page">
      <co-banner label="Cobalt starter banner">
        <span slot="title">Cobalt starter</span>
      </co-banner>
      <section class="starter-content">
        <co-card label="Starter content">
          <div class="starter-card">
            <p class="starter-eyebrow">Vanilla TypeScript</p>
            <h1 class="starter-title">Build with Cobalt components</h1>
            <p class="starter-copy">
              Tokens, base styles, theme styles, and custom elements are ready to use.
            </p>
            <div>
              <co-button id="success-button" variant="success">Success</co-button>
            </div>
          </div>
        </co-card>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
