<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* The webview inherits VS Code theme tokens so light, dark, and high-contrast themes stay native. */
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--vscode-foreground);
        background: var(--vscode-sideBar-background);
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .shell {
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr);
        height: 100vh;
        min-height: 0;
      }

      .header,
      .filters,
      .status {
        padding: 10px 12px;
        border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
      }

      .title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .source {
        margin-top: 4px;
        color: var(--vscode-descriptionForeground);
        font-size: 11px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
      }

      .tab {
        min-width: 0;
        padding: 8px 6px;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--vscode-descriptionForeground);
        background: transparent;
        cursor: pointer;
      }

      .tab[aria-selected='true'] {
        color: var(--vscode-foreground);
        border-bottom-color: var(--vscode-focusBorder);
      }

      .filters {
        display: grid;
        gap: 8px;
      }

      .input,
      .select {
        width: 100%;
        min-height: 28px;
        border: 1px solid var(--vscode-input-border, transparent);
        color: var(--vscode-input-foreground);
        background: var(--vscode-input-background);
        padding: 4px 7px;
      }

      .filter-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .filter-row[hidden],
      .semantic-filter[hidden] {
        display: none;
      }

      .semantic-filter {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--vscode-descriptionForeground);
        font-size: 12px;
      }

      .semantic-filter input {
        margin: 0;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--vscode-descriptionForeground);
        font-size: 11px;
      }

      .list {
        min-height: 0;
        overflow: auto;
      }

      /* Tree rows are generated from token name segments so dense token sets remain scannable. */
      .tree {
        min-width: 0;
      }

      .branch-toggle,
      .tree-leaf {
        width: 100%;
        min-width: 0;
        border: 0;
        border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
        color: var(--vscode-foreground);
        background: transparent;
        text-align: left;
      }

      .branch-toggle {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 7px 10px 7px calc(var(--depth) * 16px + 10px);
        cursor: pointer;
      }

      .branch-toggle:hover,
      .tree-leaf:hover {
        background: var(--vscode-list-hoverBackground);
      }

      .chevron {
        color: var(--vscode-descriptionForeground);
        font-size: 10px;
        transform: rotate(0deg);
        transition: transform 120ms ease;
      }

      .branch-toggle[aria-expanded='true'] .chevron {
        transform: rotate(90deg);
      }

      .branch-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .branch-count {
        color: var(--vscode-descriptionForeground);
        font-size: 11px;
      }

      .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
      }

      .tree-leaf {
        padding: 0;
      }

      .tree-leaf .item {
        padding-left: calc(var(--depth) * 16px + 12px);
      }

      .item-main {
        min-width: 0;
      }

      .name-row {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .leaf-label {
        flex: 0 0 auto;
        color: var(--vscode-descriptionForeground);
        font-family: var(--vscode-editor-font-family);
        font-size: 11px;
      }

      .name {
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--vscode-foreground);
        font-family: var(--vscode-editor-font-family);
        font-size: 12px;
      }

      .meta,
      .desc,
      .css {
        margin-top: 5px;
        color: var(--vscode-descriptionForeground);
        font-size: 11px;
      }

      .css {
        white-space: pre-wrap;
        font-family: var(--vscode-editor-font-family);
      }

      .swatch {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border: 1px solid var(--vscode-contrastBorder, rgba(127, 127, 127, 0.5));
        border-radius: 3px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .icon-button {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid var(--vscode-button-border, transparent);
        border-radius: 4px;
        color: var(--vscode-button-secondaryForeground);
        background: var(--vscode-button-secondaryBackground);
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }

      .button-icon {
        width: 16px;
        height: 16px;
        pointer-events: none;
        stroke: currentColor;
      }

      .empty {
        padding: 24px 12px;
        color: var(--vscode-descriptionForeground);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Static shell. The script fills the source, filters, status, and list from extension metadata. -->
    <main class="shell">
      <header class="header">
        <h1 class="title">Cobalt Tokens Explorer</h1>
        <div id="source" class="source"></div>
      </header>
      <nav class="tabs" aria-label="Cobalt browser">
        <button class="tab" type="button" data-tab="main">Main</button>
        <button class="tab" type="button" data-tab="palettes">Palettes</button>
        <button class="tab" type="button" data-tab="utilities">Utilities</button>
      </nav>
      <section class="filters">
        <input id="query" class="input" type="search" placeholder="Search" />
        <div id="filter-row" class="filter-row">
          <select id="category" class="select"></select>
          <select id="theme" class="select"></select>
        </div>
        <label id="semantic-filter" class="semantic-filter">
          <input id="semantic-only" type="checkbox" />
          Semantic tokens only
        </label>
      </section>
      <div id="status" class="status"></div>
      <section id="list" class="list" aria-live="polite"></section>
    </main>
    <script nonce="{{nonce}}">
            // The extension host replaces these placeholders before assigning webview.html.
            // Keeping the renderer inline under the same nonce avoids separate local script loading.
            window.__cobaltInitialSnapshot = {{snapshotJson}};
      {{webviewScript}}
    </script>
  </body>
</html>
